        :root {

            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 700px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            padding: 30px;
            transition: all 0.3s ease;
        }

        header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .selector-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 1rem;
            background-color: #fff;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--primary);
        }

        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 10px;
        }

        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            width: 100%;
            margin-top: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-section {
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 15px 20px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--primary);
            background-color: rgba(74, 111, 165, 0.05);
        }

        .option-prefix {
            font-weight: bold;
            margin-right: 15px;
            background: var(--bg-color);
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--text-light);
        }

        /* Feedback Classes */
        .option-btn.correct {
            background-color: rgba(46, 204, 113, 0.15) !important;
            border-color: var(--success) !important;
            color: #1e7e34;
        }

        .option-btn.incorrect {
            background-color: rgba(231, 76, 60, 0.15) !important;
            border-color: var(--error) !important;
            color: #bd2130;
        }

        .feedback-msg {
            margin-top: 15px;
            font-weight: 600;
            font-size: 1rem;
            display: none;
        }

        .feedback-msg.correct {
            color: var(--success);
            display: block;
        }

        .feedback-msg.incorrect {
            color: var(--error);
            display: block;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s ease;
        }

        .action-btn:hover:not([disabled]) {
            background: var(--primary-hover);
        }

        .action-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        .score-badge {
            font-weight: bold;
            color: var(--primary);
            background: rgba(74, 111, 165, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
        }
    </style>
</head>

        <footer>
            <button class="action-btn" id="prev-btn" onclick="prevQuestion()" disabled>Previous</button>
            <button class="action-btn" id="next-btn" onclick="nextQuestion()" disabled>Next</button>
        </footer>

                            },
                            "answer": "C"
                        },
                        {
                            "id": 117,
                            "question": "Non-Functional Requirements specify:",
                            "options": {
                                "A": "The specific tasks and processes the system must perform",
                                "B": "What the system must do to fulfill business needs",
                                "C": "Criteria to judge the operation of a system, such as performance, security, and reliability",
                                "D": "The color scheme and language of the user interface"
                            },
                            "answer": "C"
                        },
                        {
                            "id": 118,
                            "question": "Which type of requirement refers to 'high-level statements of the goals, objectives, or needs of an organization'?",
                            "options": {
                                "A": "User Requirements",
                                "B": "Functional Requirements",
                                "C": "Technical Requirements",
                                "D": "Business Requirements"
                            },
                            "answer": "D"
                        },
                        {
                            "id": 119,
                            "question": "The deliverable at the end of the Systems Analysis phase is:",
                            "options": {
                                "A": "System Design Specification",
                                "B": "Preliminary Investigation Report",
                                "C": "System Requirements Specifications (SRS)",
                                "D": "A fully functioning and documented Information System"
                            },
                            "answer": "C"
                        },
                        {
                            "id": 120,
                            "question": "'The system shall not allow registration for the same user, using identification number as key' is an example of:",
                            "options": {
                                "A": "Functional Requirement",
                                "B": "Non-Functional Requirement (Reliability)",
                                "C": "Business Requirement",
                                "D": "Architectural Requirement"
                            },
                            "answer": "B"
                        }
                    ]
                }
            ]
        }

        // Application State
        let currentChapterIdx = 0;
        let currentQuestionIdx = 0;
        let score = 0;
        let totalAnswered = 0;

        // Tracking user history so they can change answers or see what they did
        let userAnswers = {}; // key format: 'chap-quest' -> choice

        // DOM Elements
        const chapterSelect = document.getElementById('chapter-select');
        const questionText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const feedbackMsg = document.getElementById('feedback-msg');
        const questionCount = document.getElementById('question-count');
        const scoreDisplay = document.getElementById('score-display');
        const progressFill = document.getElementById('progress-fill');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // Initialize UI
        function initQuiz() {
            // Populate Dropdown
            chapterSelect.innerHTML = '';
            quizData.chapters.forEach((ch, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                option.textContent = `Ch ${ch.chapter}: ${ch.title}`;
                chapterSelect.appendChild(option);
            });

            loadChapter();
        }

        function changeChapter() {
            currentChapterIdx = parseInt(chapterSelect.value);
            currentQuestionIdx = 0;
            loadChapter();
        }

        function loadChapter() {
            displayQuestion();
        }

        function displayQuestion() {
            const chapter = quizData.chapters[currentChapterIdx];
            const question = chapter.questions[currentQuestionIdx];

            // Update Headers
            questionCount.textContent = `Question ${currentQuestionIdx + 1} of ${chapter.questions.length}`;
            scoreDisplay.textContent = `Score: ${score}/${totalAnswered}`;

            // Update Progress Bar
            const progressPercent = ((currentQuestionIdx + 1) / chapter.questions.length) * 100;
            progressFill.style.width = `${progressPercent}%`;

            // Set Question Text
            questionText.textContent = `${question.id}. ${question.question}`;

            // Clear Feedback
            feedbackMsg.className = 'feedback-msg';
            feedbackMsg.textContent = '';

            // Set Options
            optionsGrid.innerHTML = '';
            const trackingKey = `${currentChapterIdx}-${currentQuestionIdx}`;
            const alreadyAnswered = userAnswers.hasOwnProperty(trackingKey);

            Object.entries(question.options).forEach(([key, value]) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.innerHTML = `<span class="option-prefix">${key}</span> ${value}`;

                if (alreadyAnswered) {
                    button.disabled = true;
                    if (key === question.answer) {
                        button.classList.add('correct');
                    }
                    if (userAnswers[trackingKey] === key && key !== question.answer) {
                        button.classList.add('incorrect');
                    }
                } else {
                    button.onclick = () => selectOption(key, question.answer);
                }

                optionsGrid.appendChild(button);
            });

            // Show historical feedback message if already answered
            if (alreadyAnswered) {
                if (userAnswers[trackingKey] === question.answer) {
                    feedbackMsg.textContent = "Correct!";
                    feedbackMsg.className = "feedback-msg correct";
                } else {
                    feedbackMsg.textContent = `Incorrect. Correct answer is ${question.answer}`;
                    feedbackMsg.className = "feedback-msg incorrect";
                }
            }

            // Handle Nav Buttons
            prevBtn.disabled = currentQuestionIdx === 0;
            nextBtn.disabled = currentQuestionIdx === chapter.questions.length - 1;
        }

        function selectOption(selectedKey, correctKey) {
            const trackingKey = `${currentChapterIdx}-${currentQuestionIdx}`;
            userAnswers[trackingKey] = selectedKey;
            totalAnswered++;

            const isCorrect = selectedKey === correctKey;
            if (isCorrect) score++;

            // Lock buttons and colorize immediately
            const buttons = optionsGrid.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                const prefix = btn.querySelector('.option-prefix').textContent;
                if (prefix === correctKey) {
                    btn.classList.add('correct');
                } else if (prefix === selectedKey) {
                    btn.classList.add('incorrect');
                }
            });

            // Show message
            if (isCorrect) {
                feedbackMsg.textContent = "Correct!";
                feedbackMsg.className = "feedback-msg correct";
            } else {
                feedbackMsg.textContent = `Incorrect. Correct answer is ${correctKey}`;
                feedbackMsg.className = "feedback-msg incorrect";
            }

            // Refresh score view
            scoreDisplay.textContent = `Score: ${score}/${totalAnswered}`;
        }

        function nextQuestion() {
            const chapter = quizData.chapters[currentChapterIdx];
            if (currentQuestionIdx < chapter.questions.length - 1) {
                currentQuestionIdx++;
                displayQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIdx > 0) {
                currentQuestionIdx--;
                displayQuestion();
            }
        }

        // Run on startup
        initQuiz();
    </script>
</body>

</html>
